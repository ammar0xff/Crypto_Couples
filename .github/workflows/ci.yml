name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Core engine tests
        run: python -m pytest tests/ -q

      - name: Backend unit tests
        run: python -m pytest backend/tests/ -q
        env:
          APP_ENV: test

      - name: Start backend for E2E
        run: |
          PYTHONPATH=${{ github.workspace }}/backend python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          sleep 4
          tail -n 10 /tmp/backend.log

      - name: Live E2E smoke
        run: PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/backend python backend/scripts/smoke_e2e.py

      - name: Dump backend logs on failure
        if: failure()
        run: tail -n 80 /tmp/backend.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Production build + service worker
        working-directory: frontend
        run: npx vite build

      - name: PWA artifacts present
        working-directory: frontend
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          echo "Service worker and manifest OK"