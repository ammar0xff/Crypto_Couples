[project]
name = "crypto-couples"
version = "0.1.0"
description = "Visual cryptography and secret sharing for images, audio, video and files (CLI + FastAPI + PWA)"
requires-python = ">=3.10"
# NOTE: keep runtime pins in sync with backend/requirements.txt (the build
# source of truth for pip/CI). Vercel's @vercel/python builder installs from
# THIS file, so the runtime deps are mirrored here.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
